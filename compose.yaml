name: postal-assessment

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: assessment
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: ${ASSESSMENT_DB_PASSWORD:?set in deploy/.env.runtime}
    volumes:
      - assessment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment -d assessment"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://assessment:${ASSESSMENT_DB_PASSWORD}@db:5432/assessment
      JWT_SECRET: ${ASSESSMENT_JWT_SECRET:?set in deploy/.env.runtime}
      JWT_EXPIRE_MINUTES: 480
      CORS_ORIGINS: http://127.0.0.1:${ASSESSMENT_PORT:-8080},http://localhost:${ASSESSMENT_PORT:-8080}
      BOOTSTRAP_ADMIN_USERNAME: ${ASSESSMENT_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${ASSESSMENT_ADMIN_PASSWORD:?set in deploy/.env.runtime}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${ASSESSMENT_ADMIN_DISPLAY_NAME:-系统管理员}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${ASSESSMENT_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  assessment_postgres_data:
